<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>DZW — المجتمع</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Reem+Kufi:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#000;--sf:#0d0d0d;--sf2:#161616;--line:#2a2410;--gold:#d4af37;--hi:#f4dc8c;--lo:#8a6d14;--white:#f7f5ef;--mute:#a8a396;--ff:'Cairo','Segoe UI',Tahoma,sans-serif;--ffd:'Reem Kufi','Cairo',Tahoma,sans-serif;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:80px}
body{margin:0;background:var(--bg);color:var(--white);font-family:var(--ff);line-height:1.8;font-size:17px}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--hi);outline-offset:3px}
.wrap{max-width:1120px;margin:0 auto;padding:0 22px}
.gold{background:linear-gradient(100deg,var(--lo),var(--hi) 45%,var(--gold) 70%,var(--lo));-webkit-background-clip:text;background-clip:text;color:transparent}
header{position:sticky;top:0;z-index:50;background:rgba(0,0,0,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;justify-content:space-between;height:68px;gap:14px}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--ffd);font-size:26px;font-weight:700}
.mark{width:38px;height:38px;border:2px solid var(--gold);border-radius:50%;display:grid;place-items:center;font-size:12px;color:var(--hi)}
nav{display:flex;gap:2px;flex-wrap:wrap;align-items:center}
nav a,nav button{padding:8px 13px;border-radius:8px;color:var(--mute);font-weight:600;font-size:15px;background:none;border:0;cursor:pointer;font-family:var(--ff)}
nav a:hover,nav button:hover{color:var(--hi);background:var(--sf2)}nav a.on{color:#000;background:var(--gold)}
.burger{display:none;background:none;border:1px solid var(--line);color:var(--hi);border-radius:8px;width:42px;height:42px;font-size:20px;cursor:pointer}
.btn{display:inline-flex;padding:11px 24px;border-radius:10px;font-weight:700;font-family:var(--ff);font-size:16px;cursor:pointer;border:1.5px solid var(--gold);transition:transform .15s}
.btn.fill{background:linear-gradient(120deg,var(--gold),var(--hi));color:#000}.btn.fill:hover{transform:translateY(-2px)}
.btn.ghost{background:transparent;color:var(--hi)}.btn.sm{padding:5px 14px;font-size:14px}
h2{font-family:var(--ffd);font-size:clamp(30px,5vw,48px);margin:0 0 10px;line-height:1.2}
.lead{color:var(--mute);max-width:62ch;margin:0 0 28px}
.page{padding:56px 0 80px;min-height:70vh}
.hero{padding:84px 0 64px;border-bottom:1px solid var(--line);background:radial-gradient(ellipse 60% 70% at 78% 30%,rgba(212,175,55,.2),transparent 70%),repeating-linear-gradient(115deg,transparent 0 46px,rgba(212,175,55,.045) 46px 47px)}
.word{font-family:var(--ffd);font-weight:700;font-size:clamp(96px,19vw,220px);line-height:.95;margin:0;animation:rise .9s cubic-bezier(.2,.7,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(34px)}to{opacity:1;transform:none}}
.tag{font-size:clamp(20px,2.6vw,28px);font-weight:700;margin:16px 0 8px;max-width:30ch}
.cta{display:flex;gap:12px;flex-wrap:wrap;margin-top:22px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.card{display:block;background:var(--sf);border:1px solid var(--line);border-radius:14px;padding:22px}
a.card:hover{border-color:var(--gold)}.card h3{margin:0 0 6px;font-size:19px;color:var(--hi)}.card p{margin:0;color:var(--mute);font-size:15px}
.app{display:grid;grid-template-columns:250px 1fr;gap:18px;align-items:start}
.side{background:var(--sf);border:1px solid var(--line);border-radius:14px;padding:12px;position:sticky;top:90px}
.sg{color:var(--mute);font-size:13px;font-weight:700;padding:10px 10px 4px}
.rl{display:block;padding:7px 10px;border-radius:8px;font-size:15.5px}.rl:hover{background:var(--sf2)}.rl.on{background:var(--gold);color:#000;font-weight:700}
.room{background:var(--sf);border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;min-height:540px}
.rh{padding:16px 20px;border-bottom:1px solid var(--line)}.rh h3{margin:0;font-size:21px;color:var(--hi)}.rh p{margin:0;color:var(--mute);font-size:14.5px}
.msgs{flex:1;max-height:56vh;overflow-y:auto;padding:14px 20px;display:flex;flex-direction:column;gap:12px}
.m{border-inline-start:3px solid var(--lo);padding:2px 12px}.m.pin{order:-1;background:rgba(212,175,55,.08);border-inline-start-color:var(--gold)}
.m b{color:var(--hi)}.m small{color:var(--mute);margin-inline-start:8px;font-size:12.5px}.m p{margin:0;white-space:pre-wrap;word-break:break-word}
.m button{background:none;border:0;color:var(--mute);cursor:pointer;font-size:12.5px;font-family:var(--ff)}
.empty{color:var(--mute);text-align:center;padding:40px 10px}
.comp{border-top:1px solid var(--line);padding:14px 20px;display:grid;gap:10px}
input,textarea{background:#000;border:1px solid var(--line);color:var(--white);padding:10px 14px;border-radius:10px;font-family:var(--ff);font-size:16px;width:100%}
textarea{min-height:76px;resize:vertical}
.lab{display:block;color:var(--mute);font-size:14px;margin:10px 0 4px}
.form{max-width:520px;background:var(--sf);border:1px solid var(--line);border-radius:14px;padding:24px}
.tabs{display:flex;gap:8px;margin-bottom:10px}
.tab{background:none;color:var(--mute);border:1px solid var(--line);border-radius:999px;padding:7px 20px;font-family:var(--ff);font-weight:600;cursor:pointer;font-size:16px}.tab.on{background:var(--gold);color:#000;border-color:var(--gold)}
.msg{color:var(--hi);margin:12px 0 0;min-height:1.5em}
.rules{white-space:pre-wrap;background:var(--sf);border:1px solid var(--line);border-radius:14px;padding:24px;max-width:760px}
footer{padding:26px 0 40px;color:var(--mute);font-size:14px;text-align:center;border-top:1px solid var(--line)}
@media(max-width:860px){.app{grid-template-columns:1fr}.side{position:static}.burger{display:block}
nav{display:none;position:absolute;top:68px;inset-inline:0;flex-direction:column;align-items:stretch;background:#000;border-bottom:1px solid var(--line);padding:10px 22px 16px}nav.open{display:flex}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header><div class="wrap bar">
  <a class="logo" href="#home" aria-label="DZW"><span class="mark">DZW</span><span class="gold">DZW</span></a>
  <nav id="nav" aria-label="التنقل"></nav>
  <button class="burger" id="burger" aria-label="القائمة" aria-expanded="false">☰</button>
</div></header>
<main id="view"></main>
<footer><div class="wrap">DZW. مجتمعنا الخاص.</div></footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script>
var C = window.DZW_CONFIG || {}, view = document.getElementById("view");
var sb = null, user = null, me = null, rooms = [], chan = null, mode = "in";

function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function val(id){ var e = document.getElementById(id); return e ? e.value.trim() : ""; }
function when(t){ try{ return new Date(t).toLocaleString("ar", {dateStyle:"medium", timeStyle:"short"}); }catch(e){ return ""; } }
function admin(){ return !!(me && me.role === "admin"); }
function say(t){ var e = document.getElementById("say"); if(e) e.textContent = t; }

async function boot(){
  if(!C.url || !C.key || !window.supabase){
    view.innerHTML = '<div class="wrap page"><h2 class="gold">الإعداد مطلوب</h2><p class="lead">افتح ملف config.js وضع رابط مشروع Supabase ومفتاحه العام. الخطوات كلها في README.md.</p></div>';
    return;
  }
  sb = supabase.createClient(C.url, C.key);
  var s = await sb.auth.getSession(); await setUser(s.data.session);
  sb.auth.onAuthStateChange(function(_e, ses){ setTimeout(function(){ setUser(ses).then(route); }, 0); });
  var r = await sb.from("rooms").select("*").order("sort"); rooms = r.data || [];
  route();
}
async function setUser(ses){
  user = ses ? ses.user : null; me = null;
  if(user){ var p = await sb.from("profiles").select("*").eq("id", user.id).maybeSingle(); me = p.data; }
}

function navHtml(h){
  var L = [["home","الرئيسية"],["c-global","المجتمع"],["c-wt","War Thunder"],["rules","القوانين"],["apply","انضم إلينا"]];
  return L.map(function(x){ return '<a href="#' + x[0] + '"' + (x[0] === h ? ' class="on"' : '') + '>' + x[1] + '</a>'; }).join("") +
    (user ? '<a href="#home">👤 ' + esc(me ? me.username : "") + '</a><button id="out">خروج</button>' : '<a href="#auth"' + (h === "auth" ? ' class="on"' : '') + '>دخول / تسجيل</a>');
}
async function route(){
  if(chan){ sb.removeChannel(chan); chan = null; }
  var h = (location.hash || "#home").slice(1), nv = document.getElementById("nav");
  nv.innerHTML = navHtml(h);
  var o = document.getElementById("out"); if(o) o.onclick = async function(){ await sb.auth.signOut(); location.hash = "#home"; };
  if(h.indexOf("c-") === 0) await roomView(h.slice(2));
  else if(h === "rules") await rulesView();
  else if(h === "apply") await applyView();
  else if(h === "auth") authView();
  else home();
}

function home(){
  view.innerHTML = '<div class="hero"><div class="wrap"><h1 class="word gold">DZW</h1><p class="tag">كل المجتمع في مكان واحد: دردشة، قوانين، تقديم ودعم.</p>' +
  '<div class="cta"><a class="btn fill" href="#c-global">ادخل المجتمع</a>' + (user ? '' : '<a class="btn ghost" href="#auth">أنشئ حسابك</a>') + '</div></div></div>' +
  '<div class="wrap page"><h2 class="gold">القنوات</h2><p class="lead">اختر قناة وابدأ الحديث مع الأعضاء.</p><div class="grid">' +
  rooms.map(function(r){ return '<a class="card" href="#c-' + esc(r.id) + '"><h3>' + esc(r.emoji) + ' ' + esc(r.name) + '</h3><p>' + esc(r.descr) + '</p></a>'; }).join("") + '</div></div>';
}

function authView(){
  var up = mode === "up";
  view.innerHTML = '<div class="wrap page"><h2 class="gold">' + (up ? "إنشاء حساب" : "تسجيل الدخول") + '</h2><div class="tabs">' +
  '<button class="tab' + (up ? "" : " on") + '" id="t1">دخول</button><button class="tab' + (up ? " on" : "") + '" id="t2">حساب جديد</button></div>' +
  '<div class="form">' + (up ? '<label class="lab" for="un">اسم المستخدم</label><input id="un" maxlength="24" autocomplete="username">' : '') +
  '<label class="lab" for="em">البريد الإلكتروني</label><input id="em" type="email" autocomplete="email">' +
  '<label class="lab" for="pw">كلمة المرور (6 أحرف على الأقل)</label><input id="pw" type="password" autocomplete="' + (up ? "new-password" : "current-password") + '">' +
  '<p><button class="btn fill" id="go">' + (up ? "إنشاء الحساب" : "دخول") + '</button></p><div class="msg" id="say" role="status"></div></div></div>';
  document.getElementById("t1").onclick = function(){ mode = "in"; authView(); };
  document.getElementById("t2").onclick = function(){ mode = "up"; authView(); };
  document.getElementById("go").onclick = async function(){
    var em = val("em"), pw = document.getElementById("pw").value;
    if(!em || pw.length < 6){ say("اكتب بريدك وكلمة مرور من 6 أحرف على الأقل."); return; }
    say("لحظة...");
    if(up){
      var un = val("un"); if(un.length < 2){ say("اسم المستخدم من حرفين على الأقل."); return; }
      var r = await sb.auth.signUp({email:em, password:pw, options:{data:{username:un}}});
      if(r.error){ say("تعذّر إنشاء الحساب. قد يكون الاسم أو البريد مستعملاً."); return; }
      say(r.data.session ? "تم إنشاء حسابك." : "أرسلنا رسالة تأكيد إلى بريدك. افتحها ثم سجّل الدخول.");
    } else {
      var d = await sb.auth.signInWithPassword({email:em, password:pw});
      if(d.error){ say("البريد أو كلمة المرور غير صحيحة."); return; }
      location.hash = "#home";
    }
  };
}

async function roomView(id){
  var r = rooms.filter(function(x){ return x.id === id; })[0] || rooms[0];
  if(!r){ view.innerHTML = '<div class="wrap page"><div class="empty">لا توجد قنوات. شغّل schema.sql.</div></div>'; return; }
  id = r.id;
  var cats = []; rooms.forEach(function(x){ if(cats.indexOf(x.cat) < 0) cats.push(x.cat); });
  var side = cats.map(function(c){ return '<div class="sg">' + esc(c) + '</div>' + rooms.filter(function(x){ return x.cat === c; }).map(function(x){
    return '<a class="rl' + (x.id === id ? ' on' : '') + '" href="#c-' + esc(x.id) + '">' + esc(x.emoji) + ' ' + esc(x.name) + '</a>'; }).join(""); }).join("");
  var can = user && (!r.read_only || admin());
  var comp = can ? '<div class="comp"><textarea id="tx" maxlength="800" placeholder="اكتب رسالتك" aria-label="رسالتك"></textarea><div><button class="btn fill sm" id="snd">إرسال</button> <span class="msg" id="say"></span></div></div>'
    : '<div class="comp"><span style="color:var(--mute)">' + (user ? "هذه القناة للقراءة فقط." : 'سجّل الدخول للمشاركة. <a href="#auth" style="color:var(--hi)">دخول / تسجيل</a>') + '</span></div>';
  view.innerHTML = '<div class="wrap page"><div class="app"><aside class="side" aria-label="القنوات">' + side + '</aside><section class="room"><div class="rh"><h3>' + esc(r.emoji) + ' ' + esc(r.name) + '</h3><p>' + esc(r.descr) + '</p></div><div class="msgs" id="ms"></div>' + comp + '</section></div></div>';
  var box = document.getElementById("ms");
  async function load(){
    var q = await sb.from("messages").select("id,body,pinned,created_at,user_id,profiles(username)").eq("room_id", id).order("created_at", {ascending:false}).limit(100);
    var list = (q.data || []).reverse();
    box.innerHTML = list.length ? list.map(function(m){
      var mine = user && m.user_id === user.id, ad = (admin() || mine) ? ' <button data-del="' + m.id + '">حذف</button>' : '';
      if(admin()) ad += ' <button data-pin="' + m.id + '" data-v="' + (m.pinned ? 0 : 1) + '">' + (m.pinned ? "إلغاء التثبيت" : "تثبيت") + '</button>';
      return '<div class="m' + (m.pinned ? " pin" : "") + '"><b>' + esc(m.profiles ? m.profiles.username : "عضو") + '</b>' + (m.pinned ? " 📌" : "") + '<small>' + when(m.created_at) + '</small>' + ad + '<p>' + esc(m.body) + '</p></div>';
    }).join("") : '<div class="empty">لا توجد رسائل بعد. كن أول من يكتب هنا.</div>';
    box.scrollTop = box.scrollHeight;
  }
  box.onclick = async function(e){
    var d = e.target.getAttribute("data-del"), p = e.target.getAttribute("data-pin");
    if(d) await sb.from("messages").delete().eq("id", d);
    if(p) await sb.from("messages").update({pinned: e.target.getAttribute("data-v") === "1"}).eq("id", p);
  };
  var snd = document.getElementById("snd");
  if(snd) snd.onclick = async function(){
    var t = val("tx"); if(!t) return;
    var e = (await sb.from("messages").insert({room_id:id, body:t})).error;
    if(e){ say(e.message.indexOf("slow_down") > -1 ? "انتظر بضع ثوانٍ قبل الرسالة التالية." : "تعذّر الإرسال."); return; }
    document.getElementById("tx").value = ""; say("");
  };
  await load();
  chan = sb.channel("room-" + id).on("postgres_changes", {event:"*", schema:"public", table:"messages"}, load).subscribe();
}

async function rulesView(){
  var t = ((await sb.from("site_content").select("value").eq("key", "rules").maybeSingle()).data || {}).value || "";
  view.innerHTML = '<div class="wrap page"><h2 class="gold">قوانين المجتمع</h2><p class="lead">اقرأ القوانين قبل المشاركة.</p>' + (admin() ?
    '<textarea id="rt" style="min-height:260px;max-width:760px" aria-label="نص القوانين">' + esc(t) + '</textarea><p><button class="btn fill sm" id="sv">حفظ القوانين</button> <span class="msg" id="say"></span></p>'
    : '<div class="rules">' + (t ? esc(t) : "لم تضف الإدارة القوانين بعد.") + '</div>') + '</div>';
  var sv = document.getElementById("sv");
  if(sv) sv.onclick = async function(){ var e = (await sb.from("site_content").upsert({key:"rules", value:document.getElementById("rt").value})).error; say(e ? "تعذّر الحفظ." : "تم الحفظ."); };
}

async function applyView(){
  if(!user){ view.innerHTML = '<div class="wrap page"><h2 class="gold">انضم إلى الفريق</h2><p class="lead">سجّل الدخول أولاً لتقديم طلبك. <a href="#auth" style="color:var(--hi)">دخول / تسجيل</a></p></div>'; return; }
  var apps = admin() ? ((await sb.from("applications").select("*,profiles(username)").order("created_at", {ascending:false})).data || []) : [];
  view.innerHTML = '<div class="wrap page"><h2 class="gold">انضم إلى الفريق</h2><p class="lead">املأ الطلب وستراجعه الإدارة.</p><div class="form">' +
  '<label class="lab" for="ai">اهتمامك أو لعبتك</label><input id="ai" maxlength="60"><label class="lab" for="aw">لماذا تريد الانضمام؟</label><textarea id="aw" maxlength="600"></textarea>' +
  '<p><button class="btn fill" id="sa">إرسال الطلب</button></p><div class="msg" id="say"></div></div>' +
  (admin() ? '<h2 class="gold" style="margin-top:44px;font-size:30px">الطلبات (' + apps.length + ')</h2><div class="grid">' + (apps.map(function(a){
    return '<div class="card"><h3>' + esc(a.profiles ? a.profiles.username : "") + '</h3><p>' + esc(a.interest) + '</p><p style="color:var(--white);margin-top:8px">' + esc(a.why) + '</p><p style="font-size:13px;margin-top:6px">' + when(a.created_at) + '</p></div>'; }).join("") || '<div class="empty">لا توجد طلبات.</div>') + '</div>' : '') + '</div>';
  document.getElementById("sa").onclick = async function(){
    var w = val("aw"); if(!w){ say("اكتب سبب الانضمام."); return; }
    var e = (await sb.from("applications").insert({interest:val("ai"), why:w})).error;
    say(e ? "تعذّر الإرسال." : "تم إرسال طلبك."); if(!e){ document.getElementById("aw").value = ""; }
  };
}

window.addEventListener("hashchange", function(){ if(sb){ route(); window.scrollTo(0, 0); } });
var bg = document.getElementById("burger"), nv0 = document.getElementById("nav");
bg.onclick = function(){ var o = nv0.classList.toggle("open"); bg.setAttribute("aria-expanded", o); };
nv0.addEventListener("click", function(){ nv0.classList.remove("open"); bg.setAttribute("aria-expanded", false); });
boot();
</script>
</body>
</html>
