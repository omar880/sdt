<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https://*.supabase.co; connect-src 'self' https://*.supabase.co wss://*.supabase.co; object-src 'none'; base-uri 'none'; form-action 'self'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>سوق الجملة – كل موردي الجملة في الجزائر</title><link rel="manifest" href="/manifest.json"><meta name="theme-color" content="#4a86f7">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js" integrity="sha384-0w2KAL2YHP6wKOkUDzkCDGgVvfmHnj02DHeQ6XcHOgTfFsGyonKOpShMH1x6nk9o" crossorigin="anonymous"></script>
<style>
:root{--bg:#121212;--card:#1c1c1e;--line:#2c2c30;--txt:#f2f2f3;--mut:#a5a5ad;--acc:#4a86f7;--accd:#2f6be0;--wa:#25d366;--wat:#06361a;box-sizing:border-box}
@media (prefers-color-scheme:light){:root{--bg:#f4f5f7;--card:#fff;--line:#dfe1e6;--txt:#17181a;--mut:#5b5f68;--acc:#2160e8;--accd:#1a4fc2}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font:400 15px/1.6 Cairo,Tahoma,sans-serif}
a{color:inherit;text-decoration:none}
.w{max-width:1100px;margin:auto;padding:0 16px}
header{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);z-index:5}
header .w{display:flex;align-items:center;gap:16px;height:56px}
.logo{font-weight:700;font-size:19px;color:var(--acc)}
nav{display:flex;gap:14px;margin-inline-start:auto;font-size:14px;color:var(--mut);align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;border:0;border-radius:10px;background:var(--acc);color:#fff;font:600 14px Cairo,sans-serif;cursor:pointer}
.btn:hover{background:var(--accd)}.btn.wa{background:var(--wa);color:var(--wat)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--txt)}.btn.red{background:#d33}.btn.sm{min-height:34px;padding:0 12px;font-size:13px}
input,select,textarea{min-height:44px;background:var(--card);border:1px solid var(--line);border-radius:10px;color:var(--txt);padding:8px 12px;font:400 15px Cairo,sans-serif;max-width:100%;width:100%}
input:focus,select:focus,textarea:focus,.btn:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
label{font-size:13px;color:var(--mut);display:block}
.hero{padding:36px 0 20px;text-align:center}.hero h1{font-size:clamp(24px,6vw,36px);margin:0 0 8px;line-height:1.3}
.sb{display:flex;flex-wrap:wrap;gap:8px;max-width:720px;margin:20px auto 0}.sb input{flex:1 1 220px;width:auto}.sb select{flex:1 1 150px;width:auto}
h2{font-size:20px;margin:30px 0 14px}.mut{color:var(--mut);font-size:13px}.ok{color:var(--wa)}.no{color:#ff6b6b}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:10px}
.cat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 6px;text-align:center;cursor:pointer;font-size:13px}
.cat b{display:block;font-size:28px;font-weight:400}
.grid,.stores{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.card,.box{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.card{display:flex;flex-direction:column}.box{padding:16px;margin-bottom:14px}
.img{height:130px;display:grid;place-items:center;font-size:50px;background:var(--line);overflow:hidden}
.img img{width:100%;height:100%;object-fit:cover}.img.big{height:300px;border-radius:14px}
.th{display:flex;gap:6px;margin-top:6px}.th img{width:56px;height:56px;object-fit:cover;border-radius:8px;cursor:pointer}
.cb{padding:12px;display:flex;flex-direction:column;gap:4px}.cb h3{margin:0;font-size:16px}
.price{color:var(--acc);font-weight:700;font-size:17px}
.store{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;gap:12px;align-items:center}
.av{width:52px;height:52px;border-radius:12px;background:var(--acc);color:#fff;display:grid;place-items:center;font-size:22px;flex:none;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
.lay{display:grid;grid-template-columns:240px 1fr;gap:20px;margin-top:20px}
.fl{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;align-self:start}
.pd{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:20px}
.row{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding:8px 0}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}.form .f{grid-column:1/-1}
.tag{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;background:var(--line)}
.stat{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-bottom:14px}
.stat div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center}.stat b{display:block;font-size:24px;color:var(--acc)}
.tr{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
details{margin:6px 0}.dws{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:4px;max-height:200px;overflow:auto;margin-top:8px}
.dws label{display:flex;gap:6px;align-items:center;color:var(--txt)}.dws input{width:auto;min-height:0}
#toast{display:none;position:fixed;bottom:20px;left:50%;transform:translateX(-50%);color:#fff;padding:10px 18px;border-radius:10px;z-index:9}
footer{border-top:1px solid var(--line);margin-top:30px;padding:20px 0;color:var(--mut);font-size:13px;text-align:center}
@media(max-width:760px){.lay,.pd,.form{grid-template-columns:1fr}.img.big{height:220px}}
@media print{header,footer,.btn{display:none}body{background:#fff;color:#000}}</style>
</head>
<body>
<header><div class="w"><a class="logo" href="#home">🏪 سوق الجملة</a><nav><a href="#products">المنتجات</a><a href="#stores">التجار</a><a href="#rfq">طلبات الأسعار</a><a href="#how">كيف يعمل</a><a href="#cart" id="ct">🛒</a><span id="au"></span></nav></div></header>
<main class="w" id="app"></main>
<footer><div class="w">© 2026 سوق الجملة – جميع الحقوق محفوظة</div></footer>
<div id="toast"></div>
<script>
/* ====== 1) ضع بيانات مشروعك من Supabase → Project Settings → API ====== */
const SB_URL="PASTE_SUPABASE_URL_HERE", SB_KEY="PASTE_ANON_KEY_HERE";
if(top!==self){try{top.location=self.location}catch(e){document.documentElement.innerHTML=""}}   // anti-clickjacking
/* ======================================================================= */
const $=s=>document.querySelector(s),app=h=>$("#app").innerHTML=h,go=h=>location.hash=h;
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fm=n=>Number(n).toLocaleString("fr-FR")+" دج";
const msg=(t,ok)=>{const e=$("#toast");e.textContent=t;e.style.background=ok?"#1a9c4e":"#d33";e.style.display="block";setTimeout(()=>e.style.display="none",3500)};
let db,W=[],C=[],me=null,prof=null,f={q:"",w:"",c:"",p:"",s:"new"},cache=[],FV=new Set(),PCUR=null,PROMO={};
const wn=id=>(W.find(w=>w.id==id)||{}).name_ar||"",wnh=id=>esc(wn(id));
const opts=(sel,all)=>(all!=null?`<option value="">${all}</option>`:"")+W.map(w=>`<option value="${w.id}"${sel!==""&&sel!=null&&+sel===w.id?" selected":""}>${w.id} – ${esc(w.name_ar)}</option>`).join("");
const copts=sel=>C.map(c=>`<option value="${c.id}"${sel==c.id?" selected":""}>${esc(c.name_ar)}</option>`).join("");
const norm=p=>{p=String(p).replace(/\D/g,"");return p.startsWith("0")?"213"+p.slice(1):p};
const ST={pending:"قيد المراجعة",approved:"معتمد",suspended:"موقوف"};
const img=u=>u&&String(u).startsWith(SB_URL.replace(/\/+$/,"")+"/storage/")?`<img loading="lazy" src="${esc(u)}" alt="">`:"";
const card=p=>`<div class="card"><a href="#product-${p.id}"><div class="img">${p.image_url?img(p.image_url):"📦"}</div></a><div class="cb"><h3>${esc(p.name)} <button class="btn ghost sm" data-act="fav" data-id="${p.id}" aria-label="مفضلة" style="min-height:26px;padding:0 8px">${FV.has(p.id)?"♥":"♡"}</button></h3><span class="price">${PROMO[p.id]?"🔥 "+fm(PROMO[p.id]):fm(p.carton_price)} <span class="mut">/ كرتونة</span></span><span class="mut">القطعة: ${fm(p.unit_price)} · الحد الأدنى: ${p.min_qty_cartons}</span><a class="mut" href="#store-${p.store_id}">${esc(p.store_name)} – ${wnh(p.store_wilaya_id)}</a></div></div>`;
const storeCard=s=>`<a class="store" href="#store-${s.id}"><div class="av">${s.logo_url?img(s.logo_url):"🏬"}</div><div><b>${esc(s.name)}${s.verified?" ✅":""}</b><div class="mut">${wnh(s.wilaya_id)}</div></div></a>`;
async function webp(file){const bm=await createImageBitmap(file),k=Math.min(1,1200/Math.max(bm.width,bm.height)),c=document.createElement("canvas");c.width=Math.round(bm.width*k);c.height=Math.round(bm.height*k);c.getContext("2d").drawImage(bm,0,0,c.width,c.height);return new Promise((ok,no)=>c.toBlob(b=>b?ok(b):no(new Error("تعذّر ضغط الصورة")),"image/webp",.8))}
async function up(bucket,file){if(!/^image\/(jpeg|png|webp)$/.test(file.type)||file.size>1e7)throw new Error("الصور (JPG/PNG/WebP) فقط وبحجم أقل من 10 ميغا");
 const b=await webp(file),path=`${me.id}/${Date.now()}-${Math.random().toString(36).slice(2,8)}.webp`;
 const {error}=await db.storage.from(bucket).upload(path,b,{contentType:"image/webp",cacheControl:"31536000"});if(error)throw error;return db.storage.from(bucket).getPublicUrl(path).data.publicUrl}

/* ---------- boot / auth ---------- */
async function boot(){
 if(SB_URL.includes("PASTE"))return app(`<div class="box" style="margin-top:30px"><h2 style="margin:0 0 8px">⚙️ خطوة واحدة متبقية</h2><p>افتح الملف وضع <b>SB_URL</b> و<b>SB_KEY</b> (المفتاح العام anon فقط) في أعلى قسم السكربت.</p></div>`);
 db=supabase.createClient(SB_URL,SB_KEY);
 let k=null;try{k=JSON.parse(localStorage.getItem("ref"))}catch(e){}
 const fresh=k&&Date.now()-k.t<864e5&&k.W?.length&&k.C?.length;
 const [w,c,s]=await Promise.all([fresh?{data:k.W}:db.from("wilayas").select().order("id"),fresh?{data:k.C}:db.from("categories").select().order("sort"),db.auth.getSession()]);
 W=w.data||[];C=c.data||[];if(!fresh&&W.length&&C.length)try{localStorage.setItem("ref",JSON.stringify({t:Date.now(),W,C}))}catch(e){}try{const r=new URLSearchParams(location.search).get("ref");if(r&&/^[0-9a-f-]{36}$/.test(r))localStorage.setItem("inv",r)}catch(e){}await setUser(s.data.session);await loadPromo();
 db.auth.onAuthStateChange((ev,s)=>{setTimeout(()=>setUser(s),0);if(ev==="PASSWORD_RECOVERY")setTimeout(()=>go("profile"),50)});
 addEventListener("hashchange",route);route()}
async function setUser(s){me=s?.user||null;prof=me?(await db.from("profiles").select().eq("id",me.id).maybeSingle()).data:null;FV=new Set(me?((await db.from("favorites").select("product_id")).data||[]).map(x=>x.product_id):[]);
 $("#au").innerHTML=me?`${prof?.role==="admin"?'<a href="#admin">الإدارة</a> ':''}${prof?.role==="supplier"?'<a href="#dash">لوحتي</a> ':''}<a href="#favs">♥</a> <a href="#profile">حسابي</a> <a href="#home" id="lo">خروج</a>`:'<a class="btn sm" href="#auth">دخول / تسجيل</a>';
 const lo=$("#lo");if(lo)lo.onclick=()=>db.auth.signOut()}
const R={home,products,stores,auth,dash,admin,profile,favs,cart,how,rfq};
async function route(){cartN();const h=location.hash.slice(1)||"home",i=h.indexOf("-"),a=i<0?h:h.slice(0,i),b=i<0?"":h.slice(i+1);
 app('<p class="mut" style="padding:40px;text-align:center">جارٍ التحميل…</p>');
 try{if(a==="product")await product(b);else if(a==="store")await store(b);else if(a==="catalog")await catalog(b);else await(R[a]||home)()}catch(e){app(`<p class="no" style="padding:30px">حدث خطأ: ${esc(e.message)}</p>`)}scrollTo(0,0)}

/* ---------- public pages ---------- */
async function home(){
 app(`<section class="hero"><h1>كل موردي الجملة في الجزائر في مكان واحد</h1><p class="mut">قارن الأسعار وتواصل مع التاجر مباشرة عبر واتساب</p><div class="sb"><input id="q" placeholder="ابحث عن منتج أو مورد..." aria-label="بحث"><select id="w" aria-label="الولاية">${opts("","كل الولايات ("+W.length+")")}</select><button class="btn" id="go">بحث</button></div></section>
 <h2>التصنيفات</h2><div class="cats">${C.map(c=>`<div class="cat" data-c="${c.id}" role="button" tabindex="0"><b>${esc(c.icon||"📦")}</b>${esc(c.name_ar)}</div>`).join("")}</div>
 <h2>أحدث المنتجات</h2><div class="grid" id="new"></div><h2>التجار</h2><div class="stores" id="ss"></div>
 <div class="box" style="text-align:center;margin-top:30px"><h2 style="margin:0">أنت تاجر جملة؟</h2><p class="mut">اعرض منتجاتك على أصحاب المحلات في كل الولايات.</p><a class="btn" href="#auth">سجّل الآن كمورد</a></div>`);
 const s=()=>{f.q=$("#q").value;f.w=$("#w").value;f.c="";go("products")};$("#go").onclick=s;$("#q").onkeydown=e=>e.key==="Enter"&&s();
 const [p,st]=await Promise.all([db.rpc("search_products",{lim:8}),db.from("stores_public").select("id,name,logo_url,wilaya_id,verified").limit(8)]);
 $("#new").innerHTML=(p.data||[]).map(card).join("")||'<p class="mut">لا توجد منتجات بعد.</p>';$("#ss").innerHTML=(st.data||[]).map(storeCard).join("");
 try{const r=JSON.parse(localStorage.getItem("rv"))||[];if(r.length){const {data:rv}=await db.from("products_public").select().in("id",r);if(rv?.length)$("#new").previousElementSibling.insertAdjacentHTML("beforebegin",`<h2>شاهدتها مؤخراً</h2><div class="grid">${rv.map(card).join("")}</div>`)}}catch(e){}}
async function products(){
 app(`<div class="lay"><aside class="fl"><div><label>بحث</label><input id="q" value="${esc(f.q)}"></div><div><label>الولاية (التوصيل إلى)</label><select id="w">${opts(f.w,"كل الولايات")}</select></div><div><label>التصنيف</label><select id="c"><option value="">الكل</option>${copts(f.c)}</select></div><div><label>أقصى سعر للكرتونة</label><input id="p" type="number" min="0" value="${esc(f.p)}"></div><div><label>الترتيب</label><select id="s">${[["new","الأحدث"],["cheap","الأرخص"],["exp","الأغلى"]].map(o=>`<option value="${o[0]}"${f.s===o[0]?" selected":""}>${o[1]}</option>`).join("")}</select></div></aside><section><div class="mut" id="cnt"></div><div class="grid" id="res" style="margin-top:10px"></div><button class="btn ghost" id="more" style="display:none;margin:16px auto">عرض المزيد</button></section></div>`);
 let t=0,tm,off=0,shown=0;const N=24,r=async more=>{const k=++t;if(!more){off=0;shown=0}const {data,error}=await db.rpc("search_products",{q:f.q||null,delivers_to:f.w?+f.w:null,cat_id:f.c?+f.c:null,max_price:f.p?+f.p:null,lim:N,off,sort_by:f.s||"new"});if(k!==t)return;
  if(error)return $("#res").innerHTML=`<p class="no">${esc(error.message)}</p>`;shown+=data.length;off+=data.length;$("#cnt").textContent=shown+" منتج"+(data.length===N?"+":"");
  const x=data.map(card).join("");if(more)$("#res").insertAdjacentHTML("beforeend",x);else $("#res").innerHTML=x||'<p class="mut">لا توجد نتائج مطابقة.</p>';$("#more").style.display=data.length===N?"flex":"none"};
 ["q","w","c","p","s"].forEach(k=>$("#"+k).oninput=e=>{f[k]=e.target.value;clearTimeout(tm);tm=setTimeout(r,300)});$("#more").onclick=()=>r(true);r()}
async function product(id){
 const {data:p}=await db.from("products_public").select().eq("id",id).maybeSingle();if(!p)return app('<p class="mut" style="padding:30px">المنتج غير موجود.</p>');
 const [{data:im},{data:dv}]=await Promise.all([db.from("product_images").select("url").eq("product_id",id).order("sort"),db.from("store_delivery_wilayas").select("wilaya_id").eq("store_id",p.store_id)]);
 PCUR=p;try{const r=JSON.parse(localStorage.getItem("rv"))||[];localStorage.setItem("rv",JSON.stringify([p.id,...r.filter(x=>x!==p.id)].slice(0,8)))}catch(e){}const [{data:tr0},{data:sd}]=await Promise.all([db.from("product_tiers").select("min_qty,price").eq("product_id",id).order("min_qty"),db.from("stores_public").select("delivery_fee,delivery_days,min_order").eq("id",p.store_id).maybeSingle()]);p.tr=tr0||[];const TR=p.tr;const ds=new Set((dv||[]).map(x=>x.wilaya_id)),im2=(im||[]).map(x=>x.url);
 app(`<p><a class="mut" href="#products">← العودة للمنتجات</a></p><div class="pd"><div><div class="img big" id="mi">${im2[0]?img(im2[0]):"📦"}</div><div class="th">${im2.length>1?im2.map(u=>`<img src="${esc(u)}" data-src="${esc(u)}" alt="">`).join(""):""}</div></div><div><h1 style="margin:0 0 6px">${esc(p.name)}</h1><p class="price" style="font-size:24px;margin:8px 0">${PROMO[p.id]?`<s class="mut">${fm(p.carton_price)}</s> 🔥 ${fm(PROMO[p.id])}`:fm(p.carton_price)} <span class="mut">/ كرتونة (${p.units_per_carton} قطعة)</span></p>
 <div class="row"><span>سعر القطعة</span><b>${fm(p.unit_price)}</b></div>${TR.map(t=>`<div class="row"><span>من ${t.min_qty} كرتونة</span><b>${fm(t.price)} / كرتونة</b></div>`).join("")}${sd&&(sd.delivery_fee!=null||sd.delivery_days)?`<div class="row"><span>التوصيل</span><b>${sd.delivery_fee===0?"مجاني":sd.delivery_fee!=null?fm(sd.delivery_fee):""}${sd.delivery_days?" · "+sd.delivery_days+" أيام":""}</b></div>`:""}${sd?.min_order?`<div class="row"><span>الحد الأدنى للطلبية</span><b>${fm(sd.min_order)}</b></div>`:""}<div class="row"><span>الحد الأدنى للطلب</span><b>${p.min_qty_cartons} كرتونة</b></div><div class="row"><span>آخر تحديث للسعر</span><b>${ago(p.price_updated_at)}</b></div><div class="row"><span>المخزون</span><b class="${p.stock_cartons?"ok":"no"}">${p.stock_cartons?p.stock_cartons+" كرتونة – متوفر":"غير متوفر"}</b></div><div class="row"><span>المورد</span><a href="#store-${p.store_id}"><b>${esc(p.store_name)}</b> – ${wnh(p.store_wilaya_id)}</a></div>
 <p>${esc(p.description||"")}</p><div style="display:flex;gap:8px;margin:14px 0"><input id="qt" type="number" min="${p.min_qty_cartons}" value="${p.min_qty_cartons}" style="width:90px" aria-label="الكمية"><select id="w" aria-label="الولاية">${opts(f.w,"اختر ولاية التوصيل")}</select></div><p class="mut" id="dv"></p><a class="btn wa" id="wa" target="_blank" rel="noopener" style="width:100%">💬 اطلب عبر واتساب</a><button class="btn ghost" data-act="shw" data-u="${esc(location.origin+"/p/"+p.id)}" style="width:100%;margin-top:8px">↗ شارك المنتج</button><button class="btn" data-act="cadd" style="width:100%;margin-top:8px">🛒 أضف إلى الطلبية</button><button class="btn ghost sm" data-act="rep" data-id="${p.id}" data-s="${p.store_id}" style="margin-top:8px">🚩 بلّغ عن مشكلة</button><div id="cmp"></div></div></div>`);

 const u=()=>{const w=$("#cw").value;f.w=w;Object.values(g).forEach(L=>{const t=L.reduce((n,i)=>n+prc(i)*i.q,0),a=document.querySelector(`[data-wa="${L[0].s}"]`);document.querySelector(`[data-tot="${L[0].s}"]`).textContent=fm(t);
  a.href=`https://wa.me/${L[0].ph}?text=`+encodeURIComponent("السلام عليكم، أرغب بطلب:\n"+L.map(i=>`- ${i.n} × ${i.q} كرتونة (${prc(i)} دج)`).join("\n")+`\nالمجموع: ${t} دج`+(w?`\nالتوصيل إلى ولاية ${wn(w)}`:"")+"\nشكراً.")})};
 if(c.length){$("#cw").oninput=u;document.querySelectorAll("[data-ci]").forEach(x=>x.oninput=()=>{const c2=CART(),i=c2.find(y=>y.id===x.dataset.ci);i.q=Math.max(+x.value||i.min,i.min);SAVE(c2);u()});u()}}
function how(){app(`<h2>كيف يعمل سوق الجملة؟</h2><div class="box"><b>للمورد</b><p>سجّل كمورد وأكّد بريدك، أنشئ متجرك وحدّد الولايات التي توزّع إليها، ثم أضف منتجاتك بسعر الكرتونة. بعد اعتماد المتجر من الإدارة يظهر للجميع وتصلك الطلبات مباشرة على واتساب.</p></div><div class="box"><b>لصاحب المحل</b><p>ابحث عن المنتج، قارن الأسعار، أضف ما تحتاجه إلى طلبيتك وأرسلها للمورد عبر واتساب.</p></div><div class="box"><b>أسئلة شائعة</b><p><b>من يتولى الدفع والتوصيل؟</b> يتم الاتفاق عليهما مباشرة بينك وبين المورد.<br><b>متى يظهر متجري؟</b> بعد مراجعة الإدارة.</p></div>`)}

function csv(t){const R=[];let r=[],c="",q=0;t=t.replace(/^\uFEFF/,"");for(let i=0;i<t.length;i++){const ch=t[i];if(q){if(ch==='"'){if(t[i+1]==='"'){c+='"';i++}else q=0}else c+=ch}else if(ch==='"')q=1;else if(ch===","||ch===";"){r.push(c);c=""}else if(ch==="\n"){r.push(c);R.push(r);r=[];c=""}else if(ch!=="\r")c+=ch}if(c||r.length){r.push(c);R.push(r)}return R}
function csvBox(){return `<form class="box" id="cf"><b>استيراد منتجات من ملف CSV</b><p class="mut">الأعمدة بالترتيب: name, category, carton_price, units_per_carton, min_qty, stock, description. في Excel اختر حفظ باسم ثم CSV UTF-8. التصنيف بالاسم العربي كما يظهر في الموقع، والحد 300 منتج. صف العناوين يُتجاهل تلقائياً.</p><input type="file" id="cfl" accept=".csv,text/csv" required><button class="btn" style="margin-top:8px">استيراد</button></form>`}
function qeBox(){return `<form class="box" id="qf"><b>تعديل سريع: السعر (دج) ثم المخزون (كرتونة)</b>${cache.map(x=>`<div class="tr"><span>${esc(x.name)}</span><span><input type="number" min="1" step="0.01" value="${x.carton_price}" data-qid="${x.id}" data-k="carton_price" style="width:110px" aria-label="السعر"> <input type="number" min="0" value="${x.stock_cartons}" data-qid="${x.id}" data-k="stock_cartons" style="width:80px" aria-label="المخزون"></span></div>`).join("")}<button class="btn" style="margin-top:8px">حفظ الكل</button></form>`}

const ago=t=>{if(!t)return"—";const n=Math.floor((Date.now()-new Date(t))/864e5);return n<1?"اليوم":n<2?"أمس":"منذ "+n+" يوم"};
async function cmpP(p){const {data}=await db.rpc("search_products",{q:p.name.split(" ").slice(0,2).join(" "),lim:8,sort_by:"cheap"}),o=(data||[]).filter(x=>x.id!==p.id&&x.store_id!==p.store_id).slice(0,5);if(o.length&&$("#cmp"))$("#cmp").innerHTML=`<h3>قارن مع موردين آخرين</h3>`+o.map(x=>`<a class="tr" href="#product-${x.id}"><span>${esc(x.store_name)}</span><b>${fm(x.carton_price)}</b></a>`).join("")}
async function rvw(id){const [{data:r},{data:L}]=await Promise.all([db.from("store_ratings").select().eq("store_id",id).maybeSingle(),db.from("reviews").select("rating,comment,author").eq("store_id",id).order("created_at",{ascending:false}).limit(10)]);
 $("#rv").innerHTML=`<div class="box"><b>⭐ التقييمات ${r?`${(+r.avg).toFixed(1)} (${r.cnt})`:"— لا تقييمات بعد"}</b>${(L||[]).map(x=>`<div class="row"><span>${"★".repeat(x.rating)} ${esc(x.comment||"")}<br><span class="mut">${esc(x.author||"تاجر")}</span></span></div>`).join("")}${prof?.role==="shop_owner"?`<form id="rf" style="display:grid;gap:8px;margin-top:10px"><select id="rs">${[5,4,3,2,1].map(n=>`<option value="${n}">${"★".repeat(n)}</option>`).join("")}</select><textarea id="rc" rows="2" maxlength="300" placeholder="رأيك في التعامل مع المورد (اختياري)"></textarea><button class="btn sm">أضف تقييمك</button></form>`:'<p class="mut">يضيف التقييم أصحاب المحلات المسجّلون.</p>'}</div>`;
 const f2=$("#rf");if(f2)f2.onsubmit=async e=>{e.preventDefault();const {error}=await db.rpc("save_review",{p_store:id,p_rating:+$("#rs").value,p_comment:$("#rc").value});msg(error?error.message:"شكراً لتقييمك ✓",!error);if(!error)rvw(id)}}
async function rfq(){if(!me)return go("auth");const sup=prof?.role==="supplier",{data}=await db.from("rfq").select().gte("created_at",new Date(Date.now()-2592e6).toISOString()).order("created_at",{ascending:false}).limit(60);
 app(`<h2>طلبات عروض الأسعار</h2>${prof?.role==="shop_owner"?`<form class="box form" id="qf2"><div class="f"><label>ماذا تحتاج؟</label><input id="qi" maxlength="200" required placeholder="مثال: 50 كرتونة زيت مائدة 5 لتر"></div><div><label>الكمية (اختياري)</label><input id="qq" maxlength="60"></div><div><label>الولاية</label><select id="qw" required>${opts("","اختر")}</select></div><div class="f"><label>رقم واتساب للتواصل</label><input id="qp" type="tel" value="${esc(prof.phone?"0"+prof.phone.slice(3):"")}" required></div><button class="btn f">انشر الطلب</button></form>`:""}<div class="box">${(data||[]).map(x=>`<div class="tr"><span><b>${esc(x.item)}</b> ${esc(x.qty||"")}<br><span class="mut">${wnh(x.wilaya_id)}</span></span>${sup?`<a class="btn wa sm" target="_blank" rel="noopener" href="https://wa.me/${esc(x.phone)}?text=${encodeURIComponent("السلام عليكم، رأيت طلبك على سوق الجملة: "+x.item)}">قدّم عرضك</a>`:x.user_id===me.id?`<button class="btn red sm" data-act="rdel" data-id="${x.id}">حذف</button>`:""}</span></div>`).join("")||'<p class="mut">لا توجد طلبات.</p>'}</div>`);
 const q=$("#qf2");if(q)q.onsubmit=async e=>{e.preventDefault();const ph=norm($("#qp").value);if(!/^213[567]\d{8}$/.test(ph))return msg("رقم غير صحيح");const {error}=await db.from("rfq").insert({user_id:me.id,item:$("#qi").value,qty:$("#qq").value||null,wilaya_id:+$("#qw").value,phone:ph});msg(error?error.message:"تم نشر الطلب ✓",!error);if(!error)rfq()}}

/* ---------- delegated actions ---------- */
document.addEventListener("click",async e=>{const t=e.target,d=t.dataset||{};
 if(d.src){const m=$("#mi img");if(m)m.src=d.src;return}if(!d.act)return;const s=prodSection.s;
 try{if(d.act==="pnew"){prodSection.dup=null;prodSection(s,"new")}else if(d.act==="rep"){if(!me)return go("auth");const r=prompt("ما المشكلة؟");if(!r||r.length<3)return;const {error}=await db.from("reports").insert({product_id:d.id,store_id:d.s,user_id:me.id,reason:r.slice(0,300)});msg(error?error.message:"وصلنا بلاغك ✓",!error)}
 else if(d.act==="rdel"){await db.from("rfq").delete().eq("id",d.id);rfq()}
 else if(d.act==="prt")print();
 else if(d.act==="pause"){const {error}=await db.from("stores").update({is_paused:d.v==="1"}).eq("owner_id",me.id);if(error)throw error;msg(d.v==="1"?"متجرك مخفي مؤقتاً":"عاد متجرك للظهور ✓",1);dash()}
 else if(d.act==="exp"){const {data}=await db.from("stores").select("name,status,verified,whatsapp_phone,wilaya_id,created_at"),L=["name,status,verified,phone,wilaya,created"].concat((data||[]).map(x=>[x.name,x.status,x.verified,x.whatsapp_phone,wn(x.wilaya_id),x.created_at].map(v=>`"${String(v).replace(/"/g,'""')}"`).join(",")));const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\uFEFF"+L.join("\n")],{type:"text/csv"}));a.download="stores.csv";a.click()}
 else if(d.act==="pcsv")prodSection(s,"csv");
 else if(d.act==="pqe")prodSection(s,"qe");
 else if(d.act==="pdup"){prodSection.dup=d.id;prodSection(s,"new")}
 else if(d.act==="aver"){const {error}=await db.from("stores").update({verified:d.v==="1"}).eq("id",d.id);if(error)throw error;await db.from("admin_logs").insert({admin_id:me.id,action:"verify_"+d.v,target:d.id});admin()}
 else if(d.act==="pedit")prodSection(s,d.id);else if(d.act==="pcancel")prodSection(s);
 else if(d.act==="pimgdel"){const {error}=await db.from("product_images").delete().eq("id",d.id);if(error)throw error;prodSection(s,prodSection.ed)}
 else if(d.act==="shw")open("https://wa.me/?text="+encodeURIComponent("شاهد هذا على سوق الجملة: "+d.u),"_blank","noopener");
 else if(d.act==="cpy"){await navigator.clipboard.writeText(d.u);msg("تم نسخ الرابط ✓",1)}
 else if(d.act==="fav"){if(!me)return go("auth");const on=FV.has(d.id),{error}=on?await db.from("favorites").delete().eq("product_id",d.id):await db.from("favorites").insert({user_id:me.id,product_id:d.id});if(error)throw error;on?FV.delete(d.id):FV.add(d.id);t.textContent=on?"♡":"♥"}
 else if(d.act==="cadd"){const c=CART(),p=PCUR,q=Math.max(+$("#qt").value||p.min_qty_cartons,p.min_qty_cartons),x=c.find(i=>i.id===p.id);x?x.q=q:c.push({id:p.id,n:p.name,pr:p.carton_price,q,min:p.min_qty_cartons,s:p.store_id,sn:p.store_name,ph:p.whatsapp_phone,tr:p.tr});SAVE(c);msg("أُضيف إلى الطلبية ✓",1)}
 else if(d.act==="cdel"){SAVE(CART().filter(i=>i.id!==d.id));cart()}
 else if(d.act==="ptog"){const p=cache.find(x=>x.id===d.id);await db.from("products").update({is_active:!p.is_active}).eq("id",d.id);prodSection(s)}
 else if(d.act==="pdel"){if(confirm("حذف هذا المنتج نهائياً؟")){await db.from("products").delete().eq("id",d.id);prodSection(s)}}
 else if(d.act==="ast"){const {error}=await db.from("stores").update({status:d.v}).eq("id",d.id);if(error)throw error;await db.from("admin_logs").insert({admin_id:me.id,action:"store_"+d.v,target:d.id});admin()}
 else if(d.act==="ahide"){const {error}=await db.from("products").update({is_hidden_by_admin:d.v==="1"}).eq("id",d.id);if(error)throw error;await db.from("admin_logs").insert({admin_id:me.id,action:"hide_"+d.v,target:d.id});admin()}
 else if(d.act==="ublk"){const {error}=await db.from("profiles").update({is_blocked:d.v==="1"}).eq("id",d.id);if(error)throw error;await db.from("admin_logs").insert({admin_id:me.id,action:"user_block_"+d.v,target:d.id});admin()}}catch(x){msg(x.message)}});
