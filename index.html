<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>سوق الجملة – كل موردي الجملة في الجزائر</title><link rel="manifest" href="/manifest.json"><meta name="theme-color" content="#4a86f7">

<style>
/* Design tokens — Minimalism & Swiss + professional blue (ui-ux-pro-max: B2B marketplace) */
:root{--bg:#0f1115;--card:#171a20;--card2:#1d2128;--line:#272c35;--txt:#f2f3f5;--mut:#a3a9b5;--acc:#6b9bff;--accd:#2457c9;--btn:#2f6be0;--btnh:#2457c9;--wa:#25d366;--wat:#06361a;--ok:#34d399;--danger:#ff7b7b;--r:12px;--r2:18px;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.25);--hero1:#10307f;--hero2:#2457c9;box-sizing:border-box;color-scheme:dark light}
@media (prefers-color-scheme:light){:root{--bg:#f5f7fa;--card:#fff;--card2:#f0f3f8;--line:#e2e6ed;--txt:#12161c;--mut:#566070;--acc:#1f5bdc;--btn:#1f5bdc;--btnh:#1748b0;--ok:#157a4a;--danger:#c62828;--shadow:0 1px 2px rgba(16,24,40,.06),0 8px 24px rgba(16,24,40,.08)}}
*{box-sizing:border-box}
html{scroll-padding-top:72px}
body{margin:0;background:var(--bg);color:var(--txt);font:400 15px/1.7 Cairo,Tahoma,sans-serif;-webkit-font-smoothing:antialiased;padding-bottom:env(safe-area-inset-bottom,0)}
a{color:inherit;text-decoration:none}
.w{max-width:1120px;margin:auto;padding:0 16px}
.ic{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle}
.ic.sm{width:16px;height:16px}.ic.lg{width:28px;height:28px}
/* header */
header{position:sticky;top:0;background:color-mix(in srgb,var(--bg) 88%,transparent);-webkit-backdrop-filter:saturate(1.4) blur(12px);backdrop-filter:saturate(1.4) blur(12px);border-bottom:1px solid var(--line);z-index:5;padding-top:env(safe-area-inset-top,0)}
header .w{display:flex;align-items:center;gap:14px;min-height:60px;flex-wrap:wrap}
.logo{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:19px;color:var(--txt);min-height:44px}
.logo .mk{width:32px;height:32px;border-radius:9px;background:var(--btn);color:#fff;display:grid;place-items:center}
.logo .mk .ic{width:18px;height:18px}
nav.links{display:flex;gap:2px;font-size:14px;color:var(--mut);align-items:center;margin-inline-start:12px}
nav.links a{padding:8px 12px;border-radius:9px;min-height:40px;display:inline-flex;align-items:center;transition:background-color .18s,color .18s;white-space:nowrap}
nav.links a:hover{background:var(--card2);color:var(--txt)}
nav.links a[aria-current=page]{color:var(--acc);background:color-mix(in srgb,var(--acc) 12%,transparent);font-weight:600}
.act{display:flex;align-items:center;gap:4px;margin-inline-start:auto;font-size:14px;color:var(--mut)}
.act a,.act #ct{display:inline-flex;align-items:center;gap:5px;min-height:44px;min-width:44px;justify-content:center;padding:0 10px;border-radius:10px;transition:background-color .18s,color .18s;position:relative;white-space:nowrap}
.act a:hover{background:var(--card2);color:var(--txt)}
.act .btn{color:#fff}.act .btn:hover{background:var(--btnh);color:#fff}
.cnt{min-width:18px;height:18px;padding:0 5px;border-radius:99px;background:var(--btn);color:#fff;font-size:11px;font-weight:700;line-height:18px;text-align:center}
/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 18px;border:0;border-radius:var(--r);background:var(--btn);color:#fff;font:600 14px Cairo,sans-serif;cursor:pointer;transition:background-color .18s,transform .12s,box-shadow .18s}
.btn:hover{background:var(--btnh)}.btn:active{transform:scale(.98)}
.btn.wa{background:var(--wa);color:var(--wat)}.btn.wa:hover{background:#3ae07c}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--txt)}.btn.ghost:hover{background:var(--card2)}
.btn.red{background:#c62828}.btn.sm{min-height:40px;padding:0 14px;font-size:13px}
input,select,textarea{min-height:44px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);color:var(--txt);padding:8px 12px;font:400 15px Cairo,sans-serif;max-width:100%;width:100%;transition:border-color .18s,box-shadow .18s}
input:hover,select:hover,textarea:hover{border-color:color-mix(in srgb,var(--acc) 45%,var(--line))}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--acc);outline-offset:1px;border-color:var(--acc)}
label{font-size:13px;color:var(--mut);display:block}
/* hero banner — Geometric (banner-design), website hero, safe-zone content */
.hero{position:relative;overflow:hidden;isolation:isolate;margin-top:18px;padding:clamp(28px,5vw,56px) clamp(20px,5vw,56px);border-radius:var(--r2) ;background:linear-gradient(135deg,var(--hero1),var(--hero2));color:#fff;text-align:start}
.hero .art{position:absolute;inset-block:0;inset-inline-end:0;width:min(40%,440px);height:100%;z-index:-1;opacity:.95}
.hero .in{max-width:560px}
.hero .eyebrow{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:4px 12px;border-radius:99px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);margin-bottom:14px}
.hero h1{font-size:clamp(26px,5.2vw,42px);margin:0 0 10px;line-height:1.35;font-weight:700;letter-spacing:-.2px;text-wrap:balance}
.hero p{margin:0;color:rgba(255,255,255,.92);font-size:clamp(14px,2.6vw,17px);max-width:52ch}
.sb{display:flex;flex-wrap:wrap;gap:8px;max-width:640px;margin:24px 0 0;padding:8px;border-radius:calc(var(--r) + 6px);background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2)}
.sb input{flex:1 1 200px;width:auto;border-color:transparent}.sb select{flex:1 1 140px;width:auto;border-color:transparent}
.sb .btn{background:#fff;color:#143a9c}.sb .btn:hover{background:#e8efff}
.sb .btn .ic{width:18px;height:18px}
.vp{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:14px 0 0}
.vp div{display:flex;gap:10px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.vp .vi{width:38px;height:38px;border-radius:10px;background:color-mix(in srgb,var(--acc) 14%,transparent);color:var(--acc);display:grid;place-items:center;flex:none}
.vp b{display:block;font-size:14px;line-height:1.4}.vp span{font-size:13px;color:var(--mut);line-height:1.5}
h2{font-size:21px;margin:36px 0 14px;font-weight:700;display:flex;align-items:center;gap:10px}
h2::before{content:"";width:4px;height:20px;border-radius:4px;background:var(--btn)}
.box h2,.hero h2,.fl h2{margin-top:0}
.mut{color:var(--mut);font-size:13px}.ok{color:var(--ok)}.no{color:var(--danger)}
/* categories */
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px}
.cat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 8px 14px;text-align:center;cursor:pointer;font-size:13px;font-weight:600;min-height:44px;transition:border-color .18s,transform .18s,box-shadow .18s}
.cat:hover{border-color:var(--acc);transform:translateY(-2px);box-shadow:var(--shadow)}
.cat b{display:grid;place-items:center;width:46px;height:46px;margin:0 auto 8px;border-radius:12px;background:color-mix(in srgb,var(--acc) 12%,transparent);color:var(--acc);font-size:24px;font-weight:400;line-height:1}
.cat b .ic{width:24px;height:24px}
/* cards */
.grid,.stores{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.card,.box{background:var(--card);border:1px solid var(--line);border-radius:var(--r2);overflow:hidden}
.card{display:flex;flex-direction:column;transition:border-color .18s,transform .18s,box-shadow .18s}
.card:hover{border-color:color-mix(in srgb,var(--acc) 50%,var(--line));transform:translateY(-3px);box-shadow:var(--shadow)}
.box{padding:18px;margin-bottom:14px}
.img{aspect-ratio:4/3;height:auto;display:grid;place-items:center;font-size:50px;background:var(--card2);color:var(--mut);overflow:hidden}
.img .ic{width:44px;height:44px;stroke-width:1.4;opacity:.7}
.img img{width:100%;height:100%;object-fit:cover;transition:transform .35s}
.card:hover .img img{transform:scale(1.04)}
.img.big{aspect-ratio:auto;height:320px;border-radius:var(--r2)}
.th{display:flex;gap:8px;margin-top:8px}.th img{width:60px;height:60px;object-fit:cover;border-radius:10px;cursor:pointer;border:1px solid var(--line)}
.cb{padding:14px;display:flex;flex-direction:column;gap:5px;flex:1}
.cb h3{margin:0;font-size:16px;line-height:1.45;display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.cb h3 .fav{flex:none;min-height:44px;min-width:44px;margin:-8px;padding:0;font-size:18px;line-height:1;border-radius:99px;border-color:transparent;color:var(--danger)}
.price{color:var(--acc);font-weight:700;font-size:18px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.price .promo{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:1px 8px;border-radius:99px;background:color-mix(in srgb,var(--danger) 14%,transparent);color:var(--danger)}
.cb a.mut{margin-top:auto;padding:6px 0;min-height:44px;display:flex;align-items:center;border-top:1px dashed var(--line)}
.cb a.mut:hover{color:var(--acc)}
/* stores */
.store{background:var(--card);border:1px solid var(--line);border-radius:var(--r2);padding:14px;display:flex;gap:12px;align-items:center;transition:border-color .18s,transform .18s,box-shadow .18s;min-height:44px}
.store:hover{border-color:color-mix(in srgb,var(--acc) 50%,var(--line));transform:translateY(-2px);box-shadow:var(--shadow)}
.store b{display:flex;align-items:center;gap:6px;flex-wrap:wrap;line-height:1.4}
.av{width:54px;height:54px;border-radius:14px;background:var(--btn);color:#fff;display:grid;place-items:center;font-size:22px;flex:none;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
.bdg{display:inline-flex;align-items:center;gap:3px;font-size:12px;font-weight:600;color:var(--ok);line-height:1}
.bdg.fd{color:#b7791f}
@media (prefers-color-scheme:dark){.bdg.fd{color:#f5c56b}}
.bdg .ic{width:16px;height:16px}
/* layout pieces (unchanged structure) */
.lay{display:grid;grid-template-columns:250px 1fr;gap:20px;margin-top:20px}
.fl{background:var(--card);border:1px solid var(--line);border-radius:var(--r2);padding:16px;display:flex;flex-direction:column;gap:10px;align-self:start}
.pd{display:grid;grid-template-columns:1fr 1fr;gap:28px;margin-top:20px}
.row{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding:9px 0}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}.form .f{grid-column:1/-1}
.tag{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;background:var(--card2);border:1px solid var(--line)}
.tag.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 40%,var(--line))}
.stat{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-bottom:14px}
.stat div{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;text-align:center}.stat b{display:block;font-size:24px;color:var(--acc)}
.tr{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
details{margin:6px 0}.dws{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:4px;max-height:200px;overflow:auto;margin-top:8px}
.dws label{display:flex;gap:6px;align-items:center;color:var(--txt)}.dws input{width:auto;min-height:0}
/* cta band + footer + toast */
.cta{position:relative;overflow:hidden;isolation:isolate;text-align:center;margin-top:36px;padding:34px 20px;border-radius:var(--r2);background:var(--card);border:1px solid var(--line)}
.cta::before{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(60% 120% at 50% 0,color-mix(in srgb,var(--acc) 16%,transparent),transparent 70%)}
.cta h2{justify-content:center;margin:0}.cta h2::before{display:none}
#toast{display:none;position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);color:#fff;padding:12px 20px;border-radius:var(--r);z-index:9;box-shadow:var(--shadow);max-width:calc(100vw - 32px);font-weight:600}
footer{border-top:1px solid var(--line);margin-top:48px;padding:28px 0;color:var(--mut);font-size:13px}
footer .fi{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;justify-content:space-between}
footer nav{display:flex;flex-wrap:wrap;gap:4px 16px}footer nav a{min-height:44px;display:inline-flex;align-items:center}footer nav a:hover{color:var(--acc)}
.skip{position:absolute;inset-inline-start:8px;top:-60px;background:var(--btn);color:#fff;padding:10px 16px;border-radius:var(--r);z-index:20;transition:top .15s}.skip:focus{top:8px}
@media(max-width:900px){.vp{grid-template-columns:1fr}.hero .art{opacity:.35;width:70%}}
@media(max-width:760px){.lay,.pd,.form{grid-template-columns:1fr}.img.big{height:230px}
 header .w{gap:6px 8px;padding-top:4px}
 .logo{font-size:17px}
 .act{max-width:calc(100% - 140px);overflow-x:auto;scrollbar-width:none}.act::-webkit-scrollbar{display:none}
 nav.links{order:3;width:100%;margin:0 -4px;padding-bottom:6px;overflow-x:auto;scrollbar-width:none;scroll-snap-type:x proximity}
 nav.links::-webkit-scrollbar{display:none}nav.links a{scroll-snap-align:start;background:var(--card);border:1px solid var(--line)}
 .grid,.stores{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.cb{padding:10px}.cb h3{font-size:14px}.price{font-size:16px}
 .sb .btn{flex:1 1 100%}}
@media(max-width:400px){.img{aspect-ratio:1/1}.cb h3{font-size:13.5px}.price{font-size:15px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:.01ms!important;animation-duration:.01ms!important;scroll-behavior:auto!important}.card:hover,.cat:hover,.store:hover{transform:none}}
@media print{header,footer,.btn,.hero .art{display:none}body{background:#fff;color:#000}}</style>
</head>

<a class="skip" href="#app">تخطَّ إلى المحتوى</a>
