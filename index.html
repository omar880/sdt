function parseCSV(text){const rows=[];let row=[],cell="",quoted=false;for(let i=0;i<text.length;i++){const c=text[i];if(quoted&&c==='"'&&text[i+1]==='"'){cell+='"';i++}else if(c==='"')quoted=!quoted;else if(c===','&&!quoted){row.push(cell);cell=""}else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cell);if(row.some(x=>x.trim()))rows.push(row);row=[];cell=""}else cell+=c}row.push(cell);if(row.some(x=>x.trim()))rows.push(row);return rows}

 <h2>المستخدمون</h2><div class="box">${(us.data||[]).map(x=>`<div class="tr"><span><b>${esc(x.full_name||"—")}</b> <span class="tag">${x.role==="supplier"?"مورد":"صاحب محل"}</span>${x.is_blocked?' <span class="tag no">محظور</span>':""}<br><span class="mut">${esc(x.phone||"")}</span></span><button class="btn ${x.is_blocked?"":"red "}sm" data-act="ublk" data-id="${x.id}" data-v="${x.is_blocked?0:1}">${x.is_blocked?"إلغاء الحظر":"حظر"}</button></div>`).join("")||'<p class="mut">لا يوجد مستخدمون.</p>'}</div>`)}

/* ---------- delegated actions ---------- */
document.addEventListener("click",async e=>{const t=e.target,d=t.dataset||{};
 if(d.src){const m=$("#mi img");if(m)m.src=d.src;return}if(!d.act)return;const s=prodSection.s;
 try{if(d.act==="fav-toggle"){
  if(!me||prof?.role!=="shop_owner"){msg("سجّل الدخول بحساب صاحب محل لإدارة المفضلة");return}
  const {data}=await db.from("favorites").select("product_id").eq("user_id",me.id).eq("product_id",d.id).maybeSingle();if(data){const {error}=await db.from("favorites").delete().eq("user_id",me.id).eq("product_id",d.id);if(error)throw error;msg("أزيل من المفضلة",1)}else{const {error}=await db.from("favorites").insert({user_id:me.id,product_id:d.id});if(error)throw error;msg("أضيف إلى مفضلتك",1)}if(location.hash==="#favorites")favorites()
 }else if(d.act==="price-watch"){if(!me||prof?.role!=="shop_owner"){msg("سجّل الدخول لتفعيل مراقبة السعر");return}const {data}=await db.from("price_watch").select("product_id").eq("user_id",me.id).eq("product_id",d.id).maybeSingle();const result=data?await db.from("price_watch").delete().eq("user_id",me.id).eq("product_id",d.id):await db.from("price_watch").insert({user_id:me.id,product_id:d.id});if(result.error)throw result.error;msg(data?"أوقفت مراقبة السعر":"تم تفعيل مراقبة السعر؛ ستظهر التنبيهات عند ربط خدمة الإشعارات",1)}else if(d.act==="store-fav"){if(!me||prof?.role!=="shop_owner"){msg("سجّل الدخول بحساب صاحب محل لحفظ المتاجر");return}const {data}=await db.from("favorite_stores").select("store_id").eq("user_id",me.id).eq("store_id",d.id).maybeSingle();const result=data?await db.from("favorite_stores").delete().eq("user_id",me.id).eq("store_id",d.id):await db.from("favorite_stores").insert({user_id:me.id,store_id:d.id});if(result.error)throw result.error;msg(data?"أزيل المتجر من المفضلة":"أضيف المتجر إلى مفضلتك",1)}else if(d.act==="report-product"||d.act==="report-store"||d.act==="report-review"){await sendReport(d.act==="report-product"?"product":d.act==="report-store"?"store":"review",d.id)}
 else if(d.act==="report-status"){const {error}=await db.from("reports").update({status:d.v,reviewed_by:me.id}).eq("id",d.id);if(error)throw error;await db.from("admin_logs").insert({admin_id:me.id,action:"report_"+d.v,target:d.id});admin()}
 else if(d.act==="review-hide"){const {error}=await db.from("store_reviews").update({is_hidden:d.v==="1"}).eq("id",d.id);if(error)throw error;await db.from("admin_logs").insert({admin_id:me.id,action:"review_hide_"+d.v,target:d.id});admin()}
 else if(d.act==="review-reply"){const reply=prompt("اكتب ردًا مختصرًا على التقييم:");if(reply===null)return;const {error}=await db.from("store_reviews").update({owner_reply:reply.slice(0,500)}).eq("id",d.id);if(error)throw error;msg("تم حفظ الرد",1);supplierReviews(s)}
 else if(d.act==="catalog-csv")exportCatalog();else if(d.act==="catalog-print")printCatalog();
 else if(d.act==="pnew")prodSection(s,"new");else if(d.act==="pedit")prodSection(s,d.id);else if(d.act==="pcancel")prodSection(s);
 else if(d.act==="ptog"){const p=cache.find(x=>x.id===d.id);await db.from("products").update({is_active:!p.is_active}).eq("id",d.id);prodSection(s)}
 else if(d.act==="pdel"){if(confirm("حذف هذا المنتج نهائياً؟")){const p=cache.find(x=>x.id===d.id);const {data:gone,error}=await db.from("products").delete().eq("id",d.id).select("id");if(error)throw error;if(!gone?.length)throw new Error("تعذر حذف المنتج؛ تحقق من صلاحيات متجرك.");const marker="/storage/v1/object/public/product-images/",paths=(p?.product_images||[]).map(i=>{const at=i.url.indexOf(marker);return at>=0?decodeURIComponent(i.url.slice(at+marker.length)):null}).filter(Boolean);if(paths.length){const {error:se}=await db.storage.from("product-images").remove(paths);if(se)msg("حُذف المنتج، لكن تعذّر تنظيف بعض الصور من التخزين: "+se.message)}prodSection(s)}}
 else if(d.act==="pimage-del"||d.act==="pprimary"||d.act==="pimove"){
  const p=cache.find(x=>x.id===location.hash.split("-").pop())||cache.find(x=>x.product_images?.some(i=>i.id===d.id));
  if(!p)throw new Error("تعذر العثور على المنتج؛ أعد فتح نموذج التعديل.");
  let imageWarning="";
  if(d.act==="pimage-del"){
   if(!confirm("حذف هذه الصورة؟"))return;
   const {data:url,error}=await db.rpc("manage_product_images",{p_product:p.id,p_action:"delete",p_image:d.id,p_order:null});if(error)throw error;
   const marker="/storage/v1/object/public/product-images/",at=String(url||"").indexOf(marker);
   if(at>=0){const path=decodeURIComponent(url.slice(at+marker.length));const {error:se}=await db.storage.from("product-images").remove([path]);if(se)imageWarning="حُذفت من المنتج، لكن تعذّر حذف ملف التخزين: "+se.message}
  }else if(d.act==="pprimary"){
   const {error}=await db.rpc("manage_product_images",{p_product:p.id,p_action:"set_primary",p_image:d.id,p_order:null});if(error)throw error;
  }else{
   const images=[...p.product_images],i=images.findIndex(x=>x.id===d.id),j=i+(d.dir==="up"?-1:1);if(i<0||j<0||j>=images.length)return;[images[i],images[j]]=[images[j],images[i]];
   const {error}=await db.rpc("manage_product_images",{p_product:p.id,p_action:"reorder",p_image:null,p_order:images.map(x=>x.id)});if(error)throw error;
  }
  msg(imageWarning||"تم تحديث الصور ✓",!imageWarning);prodSection(s,p.id)
 }
 else if(d.act==="verify"){const {error}=await db.from("stores").update({is_verified:d.v==="1"}).eq("id",d.id);if(error)throw error;await db.from("admin_logs").insert({admin_id:me.id,action:"store_verify_"+d.v,target:d.id});admin()}
 else if(d.act==="plan-toggle"){const {error}=await db.from("supplier_plans").update({plan:d.v,product_limit:d.v==="premium"?300:30,advanced_stats:d.v==="premium"}).eq("store_id",d.id);if(error)throw error;await db.from("admin_logs").insert({admin_id:me.id,action:"plan_"+d.v,target:d.id});admin()}
 else if(d.act==="feature"){const days=Number(prompt("مدة التمييز بالأيام (1 إلى 90):","7"));if(!Number.isFinite(days)||days<1||days>90){msg("أدخل عددًا بين 1 و90 يومًا");return}const {error}=await db.from("supplier_plans").update({featured_until:new Date(Date.now()+days*86400000).toISOString()}).eq("store_id",d.id);if(error)throw error;await db.from("admin_logs").insert({admin_id:me.id,action:"store_feature_"+days,target:d.id});admin()}
 else if(d.act==="ast"){const {error}=await db.from("stores").update({status:d.v}).eq("id",d.id);if(error)throw error;await db.from("admin_logs").insert({admin_id:me.id,action:"store_"+d.v,target:d.id});admin()}
 else if(d.act==="ahide"){const {error}=await db.from("products").update({is_hidden_by_admin:d.v==="1"}).eq("id",d.id);if(error)throw error;await db.from("admin_logs").insert({admin_id:me.id,action:"hide_"+d.v,target:d.id});admin()}
 else if(d.act==="ublk"){const {error}=await db.from("profiles").update({is_blocked:d.v==="1"}).eq("id",d.id);if(error)throw error;await db.from("admin_logs").insert({admin_id:me.id,action:"user_block_"+d.v,target:d.id});admin()}}catch(x){msg(x.message)}});
document.addEventListener("change",async e=>{if(e.target.id!=="csvImport"||!e.target.files?.[0])return;try{const raw=await e.target.files[0].text(),rows=parseCSV(raw),heads=rows.shift().map(x=>x.trim()),required=["name","category_id","carton_price","units_per_carton","min_qty_cartons","stock_cartons","description"];if(required.some(k=>!heads.includes(k)))throw new Error("الأعمدة المطلوبة: "+required.join(", "));if(rows.length>50)throw new Error("الحد الأعلى 50 منتجًا في كل استيراد");let done=0;for(const cells of rows){const x=Object.fromEntries(heads.map((h,i)=>[h,cells[i]||""]));const {error}=await db.rpc("save_product",{p_id:null,p_store:prodSection.s.id,p_cat:+x.category_id,p_name:x.name,p_desc:x.description||null,p_price:+x.carton_price,p_upc:+x.units_per_carton,p_min:+x.min_qty_cartons,p_stock:+x.stock_cartons,p_images:[]});if(error)throw new Error(`تم استيراد ${done} صفوف، ثم حدث خطأ: ${error.message}`);done++}msg(`تم استيراد ${done} منتجًا`,1);prodSection(prodSection.s)}catch(x){msg(x.message)}e.target.value=""});
if("serviceWorker" in navigator&&location.protocol.startsWith("http"))addEventListener("load",()=>navigator.serviceWorker.register("/sw.js").catch(()=>{}));
boot();
</script>
